schema: 1

# Quiver Desk settings. This file carries NO secrets: RH_ACCOUNT_NUMBER, the Telegram keys,
# SEC_USER_AGENT and ALPHA_VANTAGE_API_KEY live in .env (laptop) or /etc/quiver/quiver.env (box).
# Nothing here places an order. Every order needs the owner's Telegram tap (docs/DESK_PLAN.md §0).
# The book (names, target weights, bands) lives in the ledger. `tick.py desk-seed` reads
# strategy.yaml once at the cutover; after that only a confirmed proposal changes the book.

kill_switch_file: "KILL"               # `touch KILL` stops every execution; `rm KILL` resumes

# --- Risk start values -------------------------------------------------------
# `desk-seed` copies these into the ledger `desk_settings` table. After that a confirmed
# `set_risk` proposal changes them, and this file is only the start value.
risk:
  daily_loss_halt_pct: 20.0            # equity drop >= this vs the day's baseline -> halt taps for the day
  min_buying_power_buffer: 5           # never spend below this much remaining buying power
  min_trade_notional: 5                # $; no leg below this (a full exit is exempt)
  rebalance_drift_band_pct: 5.0        # default band for a book row with no band of its own
  cash_sleeve_ticker: "SGOV"           # the residual cash sleeve; never bought or sold

# --- Order fields ------------------------------------------------------------
# exec-check copies these onto each leg. broker_guard requires exactly these two values.
order:
  time_in_force: "gfd"
  market_hours: "regular_hours"        # fractional and dollar orders fill only in regular hours

# --- Desk start values (plan §10.3) -----------------------------------------
desk:
  requote_tolerance_pct: 1.5           # a tap re-quotes; a move over this sends new numbers
  margin_of_safety_pct: 15             # default buy-below = fair value base x (1 - this/100)
  valuation_discount_rate: 0.09        # r in the DCF and the reverse DCF
  valuation_terminal_growth: 0.03      # gt in the terminal value
  valuation_years: 10                  # N, the explicit forecast years

# --- Notifications (Telegram pages) -----------------------------------------
# The halt, auth_error and error pages. Fails SAFE: off unless enabled is exactly true.
notify:
  enabled: true

# --- Storage retention (log directories only; no desk table is ever pruned) --
storage:
  retention_days: 30                   # 0 disables pruning
  archive:
    enabled: false                     # no archive backend exists; keep false
    backend: "s3"
    bucket: ""
    prefix: "quiver/"

# --- Goal deposit capture (observability only) -------------------------------
# The goal-track step detects suspected external cash flows from day-over-day jumps in the
# equity curve. These feed only the deposit-adjusted goal return in the close brief.
goal:
  auto_capture_flows: false   # true = also auto-write settled jumps to cash_flows
  flow_min_pct: 25.0          # a jump >= this % AND >= flow_min_abs $ is a suspected flow
  flow_min_abs: 30.0
  flow_confirm_days: 2        # auto-write only after the jump settles this many baseline days
