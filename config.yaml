schema: 1

# --- Account ---------------------------------------------------------------
# The account number is a per-user value and is NOT committed: set
# RH_ACCOUNT_NUMBER in .env (gitignored, next to DEEPSEEK_API_KEY). It MUST be an
# agentic_allowed=true Robinhood account — get it by calling get_accounts in the
# Claude Code session. Missing -> load fails fast.

# --- Mode ------------------------------------------------------------------
# START in dry_run. The orchestrator will call review_equity_order but NEVER
# place_equity_order. Flip to false only after a clean dry-run validation.
dry_run: true
# Relative to the repo root (where tick.py runs). `touch KILL` halts the next
# tick; `rm KILL` resumes. Use an absolute path if you run from elsewhere.
kill_switch_file: "KILL"

# --- Universe --------------------------------------------------------------
# Keep small at first: LLM cost + runtime scale linearly with the watchlist.
watchlist: ["AAPL", "MSFT", "NVDA"]

# --- Risk guardrails (coded backstops around the model's own sizing) -------
# Sized for the ~$100 Agentic account. Bump these if you fund it with more.
risk:
  max_dollars_per_trade: 100           # hard per-trade ceiling
  daily_loss_halt_pct: 20.0            # equity drop >= this vs today's baseline -> halt + KILL
  daily_capital_deploy_cap: 1000        # max total $ of BUYS across all tickers per day
  max_open_position_per_ticker: 50    # max $ market value held in any one ticker
  min_buying_power_buffer: 5          # never spend below this much remaining buying power
  # Intraday-only caps (ignored when loop.intraday_enabled is false). max_actions
  # bounds repeat TRADES/ticker/day; max_analyses is the LLM-cost circuit breaker.
  max_actions_per_ticker_per_day: 10
  max_analyses_per_ticker_per_day: 10

# --- Order defaults --------------------------------------------------------
order:
  buy_type: "market"                  # "market" (dollar_amount, fractional) | "limit" (whole shares)
  limit_slippage_pct: 0.3             # marketable-limit buffer over the live quote (buys)
  sell_mode: "close_position"
  time_in_force: "gfd"
  market_hours: "regular_hours"       # fractional/dollar orders only fill in RTH
  # Protective stop placed AFTER an entry fills (Phase 5). Price is Python-clamped
  # (model's stop_loss only seeds it). OFF by default — a GTC stop is a resting
  # broker-side order; enable once you've validated the full lifecycle live.
  protective_stop:
    enabled: false
    stop_pct: 8.0                     # target distance below fill; clamped to a safe band
    time_in_force: "gtc"

# --- Models (DeepSeek) -----------------------------------------------------
# quick_think (chat/flash) does the analyst TOOL CALLS -> must support function
# calling. deep_think (reasoner/pro) does the debates/judgment. Verify current
# IDs at setup via: curl https://api.deepseek.com/v1/models -H "Authorization: Bearer $DEEPSEEK_API_KEY"
deepseek:
  chat_model: "deepseek-v4-flash"
  reasoner_model: "deepseek-v4-pro"

# --- Loop timing -----------------------------------------------------------
loop:
  act_after_open_minutes: 5           # wait N min after the open before acting
  analyze_timeout_sec: 900            # per-ticker analyze.py subprocess timeout
  # --- Multi-run / model-driven cadence -------------------------------------
  # OFF by default == today's exact once-a-day path (one analysis, one action per
  # ticker/day; the multi-run + cadence code stays dormant). Flip true (globally,
  # or just for a volatile day) to let the model pace re-checks within Python bounds.
  intraday_enabled: false
  per_ticker_cooldown_min: 60         # min minutes between repeat trades on a ticker
  review_floor_min: 30                # never re-analyze a ticker sooner than this
  review_ceiling_open_min: 120        # while market OPEN, never wait longer than this
  review_ceiling_min: 1440            # after close, may wait up to this (next session)

# --- Notifications (email digest of each run) ------------------------------
# Python (tick.py report) BUILDS the email + decides if it's new; the
# orchestrator SENDS it via the Resend MCP. The MCP is registered in YOUR
# Claude config (`claude mcp add resend ...`), exactly like the Robinhood MCP —
# it is NOT shipped in this repo, and the RESEND_API_KEY + sender live in that
# MCP registration, not here. See README "Email digest" to enable.
# Fails SAFE: stays OFF unless enabled is exactly `true`.
notify:
  enabled: true
  # Recipients are per-user and NOT committed: set NOTIFY_TO in .env
  # (comma-separated for multiple). Required when enabled is true.
  from: ""                              # blank -> the Resend MCP's own SENDER_EMAIL_ADDRESS is used
  subject_prefix: "[Quiver]"

# --- Storage retention (observability housekeeping; never blocks a tick) ---
# Bulky run artifacts (logs/reasoning, state/analyze_logs, framework results/cache)
# are aged out after retention_days. Decision/outcome state of record lives in the
# SQLite ledger, so pruning these loses no trading state. The S3 archive backend is
# DEFERRED (interface only): leave archive.enabled false — flipping it on before the
# backend lands degrades safely to local-only pruning.
storage:
  retention_days: 30                    # 0 disables pruning (keep everything)
  archive:
    enabled: false
    backend: "s3"
    bucket: ""                          # required only when enabled (e.g. quiver-archive)
    prefix: "quiver/"
    # AWS creds come from the standard env/instance chain, NOT this repo.
