# strategy.yaml — the macro book + 15%/12mo goal, encoded as DATA (not prose).
#
# This is the committed source of truth for the strategy layer. `tick.py
# strategy-set` writes it into the ledger (strategy_goal + target_portfolio);
# `tick.py construct` reads the LEDGER at runtime. So: yaml = source, ledger =
# runtime state. There is no third copy.
#
# Zero secrets here (like config.yaml). Fails SAFE: an absent or garbled
# strategy.yaml leaves cfg.strategy=None -> the whole strategy layer is INACTIVE
# (construct returns proceed:false, analyze.py + cmd_plan behave exactly as the
# validated once-a-day path). It NEVER auto-switches to the riskier dial-up book.
#
# All trading/sizing/rebalance decisions still live in deterministic Python
# (lib/strategy, lib/portfolio, lib/signals). This file only supplies the
# target weights + macro thesis the Python brain consumes.
schema: 1

# --- The goal ---------------------------------------------------------------
goal:
  target_return_pct: 15            # beat +15% total return over the horizon...
  horizon_months: 12               # ...within 12 months, else hold cash.
  benchmark: "SGOV ~3.6%"          # the "do nothing" alternative we must beat
  benchmark_annual_pct: 3.6        # linearized daily-prorated for per-decision alpha
  constraint: "Robinhood-tradable only; crypto allowed; cash is the only ballast"

# --- The macro thesis (operator DATA; the bot cannot fetch macro) -----------
# Catalysts + the deploy/standdown triggers that select the active book. The
# core-PCE / Fed readings are supplied by the operator (macro_state) — Python
# selects the book deterministically from them; it never reasons about macro.
macro_thesis:
  version: "2026-06-13"
  summary: >
    CAPE ~40 (2nd-highest in 140yrs); hawkish Warsh Fed (0 cuts priced, 45-57%
    odds of a 2026 hike); 10yr ~4.5%; crypto mid-bear (BTC ~$63.8k, projected
    cycle low ~Q4 2026). Base case across all sleeves ~+6%; +15% is only reached
    in a bull-tilted Fed-pivot year. The pivot is THE catalyst that lights
    semis + uranium + EM + crypto bull cases at once.
  catalysts_to_watch:
    - "2026-06-17 FOMC + dot plot"
    - "2026-06-25 core PCE"
    - "2026-07-14 CPI"
  deploy_trigger_pce_pct: 2.5      # core PCE <= this -> DEPLOY regime (recommend dial-up)
  standdown_trigger_pce_pct: 3.5   # core PCE >= this -> STAND DOWN (de-risk to core/cash)
  standdown_on_hike: true          # a confirmed Fed hike also forces STAND DOWN
  correlation_note: >
    semis + uranium + EM + crypto are ONE AI/rate/liquidity bet; they fall
    together on a hike (they do NOT diversify each other).

# --- The Robinhood-tradable universe (allow-list; add/remove gate) -----------
# A proposed ADD must be on this list AND quotable via the equities MCP.
rh_tradable_confirmed:
  [SMH, SOXX, URA, GRID, XLV, RSP, EEM, IBIT, FBTC, ETHA, FETH,
   COIN, MSTR, MARA, RIOT, CLSK, IREN, SGOV, AVUV, QQQ, XLE, SOL]

# --- The books --------------------------------------------------------------
# core_55_45 is the DEFAULT, validated active book. dial_up_63_37 is OFF;
# ACTIVATING dial-up requires flipping enabled:true (fail-safe, like dry_run).
# quotable:false marks a holding the equities MCP can't price (spot crypto) ->
# construct skips it from the executable book; its weight is held in cash.
books:
  core_55_45:
    default: true
    holdings:
      - {sleeve: "Semiconductors",  ticker: SMH,  weight: 9, band: 4}
      - {sleeve: "Semiconductors",  ticker: SOXX, weight: 4, band: 3}
      - {sleeve: "Uranium/Power",   ticker: URA,  weight: 7, band: 3}
      - {sleeve: "Uranium/Power",   ticker: GRID, weight: 6, band: 3}
      - {sleeve: "Value/Defensive", ticker: XLV,  weight: 9, band: 4}
      - {sleeve: "Value/Defensive", ticker: RSP,  weight: 5, band: 3}
      - {sleeve: "Emerging markets", ticker: EEM, weight: 6, band: 3}
      - {sleeve: "Crypto BTC",      ticker: IBIT, weight: 4, band: 2}
      - {sleeve: "Crypto alt",      ticker: SOL,  weight: 3, band: 2, quotable: false}
      - {sleeve: "Crypto ETH",      ticker: ETHA, weight: 2, band: 1}
      - {sleeve: "Cash",            ticker: SGOV, weight: 45}   # residual ballast
  dial_up_63_37:
    enabled: false        # OFF; activating dial-up requires this flag
    holdings:
      - {sleeve: "Semiconductors",  ticker: SMH,  weight: 17, band: 5}
      - {sleeve: "Uranium/Power",   ticker: URA,  weight: 5,  band: 3}
      - {sleeve: "Uranium/Power",   ticker: GRID, weight: 3,  band: 2}
      - {sleeve: "Value/Defensive", ticker: XLV,  weight: 9,  band: 4}
      - {sleeve: "Value/Defensive", ticker: RSP,  weight: 5,  band: 3}
      - {sleeve: "Emerging markets", ticker: EEM, weight: 9,  band: 4}
      - {sleeve: "Crypto BTC",      ticker: IBIT, weight: 6,  band: 3}
      - {sleeve: "Crypto alt",      ticker: SOL,  weight: 4,  band: 2, quotable: false}
      - {sleeve: "Crypto ETH",      ticker: ETHA, weight: 2,  band: 1}
      - {sleeve: "Crypto proxy",    ticker: IREN, weight: 3,  band: 2}
      - {sleeve: "Cash",            ticker: SGOV, weight: 37}

# --- Continual-learning gates (Stage 4) -------------------------------------
# Every universe-touching gate defaults SAFE; both auto_apply_* default FALSE
# (the investable universe stays human-gated unless explicitly opened).
learning:
  underperf_window: 8
  underperf_hit_floor: 0.40
  underperf_mean_floor: 0.0
  min_resolved_n: 5
  sleeve_review_min_n: 6
  derisk_on_standdown: true
  auto_apply_derisk: false              # safe direction; still OFF by default
  auto_apply_universe_changes: false    # risky direction; human-gated
  goal_gap_derisk_pct: -5.0
  proposal_expiry_days: 5
