[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
# Quiver Desk: a chat-first investing partner on Telegram. Nothing trades without the
# owner's tap. The Python package ships lib/ and the CLI entrypoint tick.py. The desk
# agents run in-process through the Claude Agent SDK. The box installs ONLY
# requirements.lock.txt: add every new import there, not only here.
name = "quiver"
version = "0.3.0"
description = "Quiver Desk: a chat-first investing partner that reads filings, proposes trades, and places an order only after the owner's tap"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
# The imports of lib/, deploy/runner/ and tick.py (checked by an AST scan).
dependencies = [
    "claude-agent-sdk==0.2.174",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.3",
    "numpy>=2.4.6",
    "pandas>=2.3.0",
    "pandas-market-calendars>=5.4.0",   # lib/market XNYS calendar
    "yfinance>=0.2.63",
    "stockstats>=0.6.5",
    "requests>=2.32.4",
    "pytz>=2025.2",
    "typing-extensions>=4.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]
