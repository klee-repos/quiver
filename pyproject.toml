[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
# Quiver — the autonomous trading desk this repo builds. The distribution is
# named "quiver". The analysis brain lives in quiver_eve/ (Node runtime), not
# under this distribution; the Python package only ships lib/ + the CLI
# entrypoints (tick.py / analyze.py). The tradingagents/ framework was deleted
# in the EVE migration (2026-07-06) — do not re-add it.
name = "quiver"
version = "0.2.5"
description = "Quiver — an autonomous trading desk that executes a multi-agent LLM signal on Robinhood's agentic trading platform"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
# Pared to what the kept GLM signal path actually imports. Dropped from
# upstream: backtrader, redis, parsel, questionary, rich, typer,
# langchain-anthropic, langchain-google-genai, langchain-experimental
# (no import of any of these survives in the kept package — verified by grep).
dependencies = [
    "langchain-core>=0.3.81",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "pandas-market-calendars>=5.4.0",   # lib/market XNYS calendar (preflight) — was only in the lock file
    "yfinance>=0.2.63",
    "stockstats>=0.6.5",
    "requests>=2.32.4",
    "pytz>=2025.2",
    "typing-extensions>=4.14.0",
    "tqdm>=4.67.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]
